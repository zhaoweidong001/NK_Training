<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄专注 · 学习打卡工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>

<!-- 顶部导航栏 -->
<header class="topbar glass">
  <div class="brand">
    <span class="brand-logo">🍅</span>
    <span class="brand-name">番茄专注</span>
  </div>

  <nav class="nav-links">
    <button class="nav-btn active" data-target="pomodoro">番茄计时</button>
    <button class="nav-btn" data-target="tasks">任务清单</button>
    <button class="nav-btn" data-target="checkin">每日打卡</button>
    <button class="nav-btn" data-target="stats">统计看板</button>
  </nav>

  <div class="top-actions">
    <button id="checkin-top-btn" class="btn-checkin">打卡</button>
    <button id="theme-toggle" class="icon-btn" title="切换主题">🌙</button>
    <button id="export-btn" class="icon-btn" title="导出数据">⬇</button>
    <div class="user-wrap">
      <button id="user-btn" class="user-btn" title="账号">👤 登录</button>
      <div id="user-menu" class="user-menu" hidden>
        <span id="user-menu-name" class="user-menu-name"></span>
        <button id="switch-account-btn" class="user-menu-item">切换账号</button>
        <button id="logout-btn" class="user-menu-item">退出登录</button>
      </div>
    </div>
  </div>
</header>

<!-- 鼓励标语 -->
<div class="cheer-line">每一次专注，都是在靠近更好的自己 · 加油！</div>

<!-- 主体 -->
<main>
  <!-- 模块一：番茄专注计时 -->
  <section id="pomodoro" class="section active">
    <div class="section-inner">
      <h2 class="section-title">番茄专注计时</h2>
      <div class="pomodoro-layout">
        <div class="card glass timer-card">
          <div class="progress-ring-wrap">
            <svg class="progress-ring" viewBox="0 0 260 260">
              <circle class="ring-track" cx="130" cy="130" r="115"></circle>
              <circle class="ring-progress" cx="130" cy="130" r="115"></circle>
            </svg>
            <div class="ring-center">
              <div id="phase-label" class="phase-label">专注</div>
              <div id="timer-display" class="timer-display">25:00</div>
              <div id="pomodoro-count" class="pomodoro-count">今日 0 个番茄</div>
            </div>
          </div>

          <div class="timer-task-select">
            <label for="timer-task">专注任务</label>
            <select id="timer-task" class="input select">
              <option value="">不选择任务</option>
            </select>
          </div>

          <div class="timer-controls">
            <button id="timer-start-pause" class="btn-primary">开始</button>
            <button id="timer-reset" class="btn-secondary">重置</button>
            <button id="timer-skip" class="btn-secondary">跳过</button>
          </div>

          <div id="timer-notice" class="timer-notice" hidden></div>
        </div>

        <div class="card glass settings-card">
          <h3 class="card-title">计时设置</h3>
          <div class="setting-row">
            <label>专注时长（分钟）</label>
            <input type="number" id="set-focus" min="1" max="120" value="25">
          </div>
          <div class="setting-row">
            <label>短休息（分钟）</label>
            <input type="number" id="set-short" min="1" max="60" value="5">
          </div>
          <div class="setting-row">
            <label>长休息（分钟）</label>
            <input type="number" id="set-long" min="1" max="90" value="15">
          </div>
          <div class="setting-row">
            <label>长休息间隔（个番茄）</label>
            <input type="number" id="set-interval" min="1" max="12" value="4">
          </div>
          <div class="setting-row">
            <label>每日目标（个番茄）</label>
            <input type="number" id="set-goal" min="1" max="50" value="8">
          </div>
          <button id="save-settings" class="btn-primary full-width">保存设置</button>
        </div>

        <div class="card glass goal-card">
          <h3 class="card-title">今日目标</h3>
          <div class="goal-now">
            <span id="goal-done" class="goal-done">0</span>
            <span class="goal-sep">/</span>
            <span id="goal-total" class="goal-total">8</span>
          </div>
          <div class="goal-bar"><div id="goal-bar-fill" class="goal-bar-fill"></div></div>
          <p id="goal-hint" class="goal-hint">继续加油！</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 模块二：学习任务清单 -->
  <section id="tasks" class="section">
    <div class="section-inner">
      <h2 class="section-title">学习任务清单</h2>

      <div class="card glass task-toolbar">
        <input type="text" id="task-search" class="input" placeholder="搜索任务...">
        <select id="task-category-filter" class="input select">
          <option value="">全部分类</option>
        </select>
        <select id="task-sort" class="input select">
          <option value="priority">按优先级</option>
          <option value="due">按截止时间</option>
          <option value="created">按创建时间</option>
        </select>
      </div>

      <div class="card glass task-form-card">
        <input type="text" id="task-title" class="input" placeholder="任务标题">
        <div class="date-wrap">
          <input type="date" id="task-due" class="input date-empty">
          <span class="date-ph">截止日期</span>
          <span class="date-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>
        </div>
        <select id="task-priority" class="input select">
          <option value="high">高优先级</option>
          <option value="medium" selected>中优先级</option>
          <option value="low">低优先级</option>
        </select>
        <input type="number" id="task-pomodoro" class="input" min="0" value="1" placeholder="番茄数">
        <select id="task-category" class="input select">
          <option value="">无分类</option>
        </select>
        <button id="task-add" class="btn-primary">添加任务</button>
        <input type="text" id="new-category" class="input" placeholder="新分类名">
        <button id="category-add" class="btn-secondary">+分类</button>
      </div>

      <div id="task-list" class="task-list"></div>
    </div>
  </section>

  <!-- 模块三：每日学习打卡 -->
  <section id="checkin" class="section">
    <div class="section-inner">
      <h2 class="section-title">每日学习打卡</h2>

      <div class="checkin-layout">
        <div class="card glass checkin-main">
          <div class="checkin-stats">
            <div class="stat-block">
              <span id="streak-days" class="stat-num">0</span>
              <span class="stat-label">连续天数</span>
            </div>
            <div class="stat-block">
              <span id="total-days" class="stat-num">0</span>
              <span class="stat-label">累计天数</span>
            </div>
          </div>
          <button id="checkin-btn" class="btn-checkin big">今日打卡</button>
          <div class="badge-area">
            <h4 class="card-title">成就徽章</h4>
            <div id="badge-list" class="badge-list"></div>
          </div>
        </div>

        <div class="card glass calendar-card">
          <h3 class="card-title" id="calendar-title">本月打卡</h3>
          <div class="calendar-nav">
            <button id="cal-prev" class="icon-btn">‹</button>
            <button id="cal-next" class="icon-btn">›</button>
          </div>
          <div class="calendar-weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 模块四：数据统计看板 -->
  <section id="stats" class="section">
    <div class="section-inner">
      <h2 class="section-title">数据统计看板</h2>

      <div class="stats-toolbar">
        <button class="range-btn active" data-range="day">今日</button>
        <button class="range-btn" data-range="week">本周</button>
        <button class="range-btn" data-range="month">本月</button>
        <button class="range-btn" data-range="all">累计</button>
      </div>

      <div class="stat-cards">
        <div class="card glass stat-card">
          <span class="sc-num" id="sc-focus-time">0h</span>
          <span class="sc-label">专注时长</span>
        </div>
        <div class="card glass stat-card">
          <span class="sc-num" id="sc-pomodoro">0</span>
          <span class="sc-label">番茄数量</span>
        </div>
        <div class="card glass stat-card">
          <span class="sc-num" id="sc-task-done">0</span>
          <span class="sc-label">完成任务</span>
        </div>
        <div class="card glass stat-card">
          <span class="sc-num" id="sc-completion">0%</span>
          <span class="sc-label">任务完成率</span>
        </div>
      </div>

      <div class="charts-grid">
        <div class="card glass chart-card">
          <h3 class="card-title">番茄数量趋势</h3>
          <canvas id="chart-trend"></canvas>
        </div>
        <div class="card glass chart-card">
          <h3 class="card-title">任务分类占比</h3>
          <canvas id="chart-pie"></canvas>
        </div>
        <div class="card glass chart-card">
          <h3 class="card-title">每日专注时长</h3>
          <canvas id="chart-duration"></canvas>
        </div>
        <div class="card glass chart-card">
          <h3 class="card-title">时段分布</h3>
          <canvas id="chart-hour"></canvas>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- 自定义提示弹窗 -->
<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal glass">
    <div class="modal-header">
      <span class="modal-title">提示</span>
      <button id="modal-close" class="modal-close">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-footer">
      <button id="modal-ok" class="btn-primary">确定</button>
    </div>
  </div>
</div>

<!-- 登录/注册弹窗 -->
<div id="auth-overlay" class="auth-overlay" hidden>
  <div class="auth-card glass">
    <div class="auth-header">
      <span class="auth-title" id="auth-title">登录</span>
    </div>
    <div class="auth-body">
      <p class="auth-sub" id="auth-sub">首次使用将自动注册新账号</p>
      <label class="auth-label" for="auth-username">用户名</label>
      <input type="text" id="auth-username" class="input" placeholder="请输入用户名" autocomplete="username">
      <label class="auth-label" for="auth-password">密码</label>
      <input type="password" id="auth-password" class="input" placeholder="请输入密码" autocomplete="current-password">
      <p class="auth-error" id="auth-error"></p>
    </div>
    <div class="auth-footer">
      <button id="auth-submit" class="btn-primary full-width">登录 / 注册</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
